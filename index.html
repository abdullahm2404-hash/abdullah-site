<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdullah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #080808;
      --gold: #c8a96e;
      --gold-dim: #7a6340;
      --white: #e8e4dc;
      --muted: #3a3a3a;
      --text-dim: #6b6560;
      --red: #8b3a3a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.6;
    }

    body::after {
      content: '';
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(200,169,110,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { opacity:0.6; transform:translate(-50%,-50%) scale(1); }
      50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.15); }
    }

    /* ── GATE ── */
    #gate {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      transition: opacity 0.9s ease;
    }
    #gate.hide { opacity: 0; pointer-events: none; }

    .gate-eyebrow {
      font-size: 0.55rem; letter-spacing: 0.35em;
      color: var(--text-dim); text-transform: uppercase;
      margin-bottom: 3rem; opacity: 0;
      animation: fadeUp 1s ease 0.4s forwards;
    }

    .gate-question {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--white); line-height: 1.35;
      margin-bottom: 3rem; opacity: 0;
      animation: fadeUp 1s ease 0.7s forwards;
    }

    .input-row {
      display: flex; align-items: center;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 0.5rem;
      width: min(280px, 80vw); opacity: 0;
      animation: fadeUp 1s ease 1.1s forwards;
      transition: border-color 0.3s ease;
    }
    .input-row.correct { border-color: var(--gold); }
    .input-row.wrong   { border-color: var(--red); animation: shake 0.4s ease; }

    @keyframes shake {
      0%,100% { transform:translateX(0); }
      20%     { transform:translateX(-6px); }
      40%     { transform:translateX(6px); }
      60%     { transform:translateX(-4px); }
      80%     { transform:translateX(4px); }
    }

    #pwd-input {
      background: transparent; border: none; outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.2em;
      color: var(--white); width: 100%;
      caret-color: var(--gold);
    }
    #pwd-input::placeholder { color: var(--text-dim); }

    .input-arrow {
      font-size: 0.7rem; color: var(--text-dim);
      cursor: pointer; padding-left: 0.5rem;
      transition: color 0.2s; user-select: none;
    }
    .input-arrow:hover { color: var(--gold); }

    .gate-hint {
      margin-top: 1.4rem; font-size: 0.55rem;
      letter-spacing: 0.15em; color: var(--text-dim);
      text-transform: uppercase; opacity: 0;
      animation: fadeUp 1s ease 1.6s forwards;
      min-height: 1em; transition: color 0.3s;
    }
    .gate-hint.error { color: var(--red); }

    /* ── MAIN / BIRTHDAY PAGE ── */
    #main {
      opacity: 0; pointer-events: none;
      transition: opacity 1.2s ease 0.3s;
      overflow-y: auto;
    }
    #main.show { opacity: 1; pointer-events: all; }

    .top-line {
      position: fixed; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      opacity: 0; z-index: 2;
    }
    .main-visible .top-line { animation: fadeIn 1s ease 0.2s forwards; }

    .wrapper {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 5rem 2rem 4rem;
      text-align: center;
    }

    /* "if you didn't care" */
    .prelude {
      font-size: 0.58rem; letter-spacing: 0.25em;
      color: var(--text-dim); text-transform: uppercase;
      line-height: 2.2; margin-bottom: 3.5rem; opacity: 0;
    }
    .main-visible .prelude { animation: fadeUp 1s ease 0.4s forwards; }

    .divider {
      width: 1px; height: 1px; margin: 0 auto 3.5rem;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      opacity: 0;
    }
    .main-visible .divider {
      animation: fadeIn 0.6s ease 1.1s forwards, expand-line 1s ease 1.3s forwards;
    }
    @keyframes expand-line {
      from { width: 1px; } to { width: min(180px, 35vw); }
    }

    /* birthday label */
    .hb-label {
      font-size: 0.55rem; letter-spacing: 0.45em;
      color: var(--gold-dim); text-transform: uppercase;
      margin-bottom: 1rem; opacity: 0;
    }
    .main-visible .hb-label { animation: fadeUp 1s ease 1.5s forwards; }

    /* big headline */
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(3.2rem, 10vw, 7rem);
      line-height: 0.95; color: var(--white);
      margin-bottom: 3rem; opacity: 0;
      letter-spacing: -0.02em;
    }
    .main-visible .headline { animation: fadeUp 1.2s ease 1.8s forwards; }
    .headline span { color: var(--gold); font-style: normal; font-weight: 400; }

    /* personal message */
    .message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(1.05rem, 2.6vw, 1.35rem);
      color: var(--text-dim); line-height: 2;
      max-width: 500px; opacity: 0;
    }
    .main-visible .message { animation: fadeUp 1s ease 2.6s forwards; }
    .message strong { color: var(--white); font-style: normal; font-weight: 400; }

    /* moon */
    .moon {
      font-size: 1.6rem; margin-top: 3rem; opacity: 0;
      display: block;
      filter: drop-shadow(0 0 12px rgba(200,169,110,0.25));
    }
    .main-visible .moon { animation: fadeIn 2s ease 3.4s forwards; }

    /* bottom bar */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0.8rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.52rem; letter-spacing: 0.2em;
      color: var(--muted); text-transform: uppercase;
      border-top: 1px solid #141414;
      opacity: 0; z-index: 2;
    }
    .main-visible .bottom-bar { animation: fadeIn 1s ease 3.8s forwards; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity:0; } to { opacity:1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
    }
    @media (max-width: 480px) {
      .bottom-bar { justify-content: center; }
      .bottom-bar .right { display: none; }
    }
  </style>
</head>
<body>

  <!-- GATE -->
  <div id="gate">
    <p class="gate-eyebrow">access restricted</p>
    <h2 class="gate-question">what do I look for<br>first, every night?</h2>
    <div class="input-row" id="input-row">
      <input id="pwd-input" type="text" placeholder="type your answer" autocomplete="off" spellcheck="false" />
      <span class="input-arrow" id="submit-arrow">→</span>
    </div>
    <p class="gate-hint" id="gate-hint">press enter or →</p>
  </div>

  <!-- BIRTHDAY PAGE -->
  <div id="main">
    <div class="top-line main-visible"></div>

    <div class="wrapper main-visible">
      <p class="prelude">
        if you didn't care,<br>you wouldn't be here.
      </p>

      <div class="divider"></div>

      <p class="hb-label">and since you are —</p>

      <h1 class="headline">
        happy<br><span>birthday.</span>
      </h1>

      <p class="message">
        i hope today feels as <strong>amazing</strong> as you are.<br>
        hope it's a good one.
      </p>

      <span class="moon">🌙</span>
    </div>

    <div class="bottom-bar main-visible">
      <span>© abdullah</span>
      <span class="right">you already know.</span>
    </div>
  </div>

  <!-- PARTICLES -->
  <canvas id="particles" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>

  <script>
    // Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, parts = [];
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    resize(); window.addEventListener('resize', resize);

    class P {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : H + 10;
        this.size = Math.random() * 1.2 + 0.3;
        this.vy = -(Math.random() * 0.3 + 0.1);
        this.vx = (Math.random() - 0.5) * 0.15;
        this.op = 0; this.maxOp = Math.random() * 0.35 + 0.05;
        this.fadingIn = true; this.life = 0;
        this.maxLife = Math.random() * 400 + 200;
      }
      update() {
        this.x += this.vx; this.y += this.vy; this.life++;
        if (this.fadingIn) { this.op = Math.min(this.op + 0.005, this.maxOp); if (this.op >= this.maxOp) this.fadingIn = false; }
        if (this.life > this.maxLife * 0.7) this.op = Math.max(this.op - 0.003, 0);
        if (this.life > this.maxLife || this.y < -10) this.reset(false);
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(200,169,110,${this.op})`; ctx.fill();
      }
    }
    for (let i = 0; i < 55; i++) parts.push(new P());
    (function loop(){ ctx.clearRect(0,0,W,H); parts.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();

    // Gate
    const gate     = document.getElementById('gate');
    const main     = document.getElementById('main');
    const input    = document.getElementById('pwd-input');
    const inputRow = document.getElementById('input-row');
    const hint     = document.getElementById('gate-hint');
    const arrow    = document.getElementById('submit-arrow');

    function attempt() {
      const val = input.value.trim().toLowerCase();
      if (val === 'moon') {
        inputRow.classList.add('correct');
        hint.textContent = '';
        setTimeout(() => {
          gate.classList.add('hide');
          setTimeout(() => {
            gate.style.display = 'none';
            main.classList.add('show');
          }, 950);
        }, 400);
      } else if (val !== '') {
        inputRow.classList.add('wrong');
        hint.classList.add('error');
        hint.textContent = 'not quite.';
        setTimeout(() => {
          inputRow.classList.remove('wrong');
          hint.classList.remove('error');
          hint.textContent = 'press enter or →';
          input.value = '';
        }, 1200);
      }
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
    arrow.addEventListener('click', attempt);
    window.addEventListener('load', () => setTimeout(() => input.focus(), 1200));
  </script>

</body>
</html>
