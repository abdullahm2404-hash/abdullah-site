<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdullah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #080808;
      --gold: #c8a96e;
      --gold-dim: #7a6340;
      --white: #e8e4dc;
      --muted: #3a3a3a;
      --text-dim: #6b6560;
      --red: #8b3a3a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    /* Noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { opacity:0.6; transform:translate(-50%,-50%) scale(1); }
      50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.1); }
    }

    /* ─── GATE SCREEN ─── */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.9s ease;
    }

    #gate.hide {
      opacity: 0;
      pointer-events: none;
    }

    .gate-eyebrow {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.4s forwards;
    }

    .gate-question {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--white);
      line-height: 1.3;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.7s forwards;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 0.5rem;
      width: min(280px, 80vw);
      opacity: 0;
      animation: fadeUp 1s ease 1.1s forwards;
      transition: border-color 0.3s ease;
    }

    .input-row.correct  { border-color: var(--gold); }
    .input-row.wrong    { border-color: var(--red);  animation: shake 0.4s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    #pwd-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--white);
      width: 100%;
      caret-color: var(--gold);
    }

    #pwd-input::placeholder { color: var(--text-dim); }

    .input-arrow {
      font-size: 0.7rem;
      color: var(--text-dim);
      cursor: pointer;
      padding-left: 0.5rem;
      transition: color 0.2s;
      user-select: none;
    }
    .input-arrow:hover { color: var(--gold); }

    .gate-hint {
      margin-top: 1.4rem;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s ease 1.6s forwards;
      min-height: 1em;
      transition: color 0.3s;
    }

    .gate-hint.error { color: var(--red); letter-spacing: 0.1em; }

    /* ─── MAIN PAGE ─── */
    #main {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease 0.3s;
    }

    #main.show {
      opacity: 1;
      pointer-events: all;
    }

    .classification {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0.6rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--muted);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
      z-index: 2;
    }

    .classification .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: inline-block;
      margin-right: 0.5rem;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%,100% { opacity:0.4; }
      50%      { opacity:1; background: var(--gold); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
    }

    .main-visible .eyebrow {
      animation: fadeUp 1s ease 0.2s forwards;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: 1.05;
      color: var(--white);
      margin-bottom: 0.4rem;
      opacity: 0;
    }

    .main-visible .headline {
      animation: fadeUp 1s ease 0.5s forwards;
    }

    .headline span {
      color: var(--gold);
      font-style: normal;
      font-weight: 400;
    }

    .signal-line {
      margin: 2.8rem auto;
      width: 1px;
      height: 1px;
      opacity: 0;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }

    .main-visible .signal-line {
      animation: fadeUp 1s ease 0.8s forwards, expand-line 1.2s ease 1s forwards;
    }

    @keyframes expand-line {
      from { width: 1px; }
      to   { width: min(320px, 60vw); }
    }

    .subtext {
      font-size: clamp(0.6rem, 1.8vw, 0.72rem);
      letter-spacing: 0.18em;
      color: var(--text-dim);
      text-transform: uppercase;
      opacity: 0;
    }

    .main-visible .subtext {
      animation: fadeUp 1s ease 1.3s forwards;
    }

    .cursor-block {
      margin: 2rem auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      opacity: 0;
    }

    .main-visible .cursor-block {
      animation: fadeUp 0.8s ease 2s forwards;
    }

    .terminal-text {
      font-size: 0.65rem;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
    }

    .cursor {
      display: inline-block;
      width: 7px; height: 0.9em;
      background: var(--gold);
      opacity: 0;
    }

    .main-visible .cursor {
      animation: blink 1.1s step-end infinite 2.2s, fadeIn 0.3s ease 2.2s forwards;
    }

    @keyframes blink {
      0%,100% { opacity:0; }
      50%      { opacity:1; }
    }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      border-top: 1px solid #1a1a1a;
      opacity: 0;
      z-index: 2;
    }

    .main-visible .bottom-bar {
      animation: fadeIn 1s ease 2.5s forwards;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity:0; }
      to   { opacity:1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
    }

    @media (max-width: 480px) {
      .classification { display: none; }
      .bottom-bar { justify-content: center; }
      .bottom-bar .right { display: none; }
    }
  </style>
</head>
<body>

  <!-- GATE -->
  <div id="gate">
    <p class="gate-eyebrow">access restricted</p>
    <h2 class="gate-question">favourite<br>celestial body</h2>
    <div class="input-row" id="input-row">
      <input id="pwd-input" type="text" placeholder="type your answer" autocomplete="off" spellcheck="false" />
      <span class="input-arrow" id="submit-arrow">→</span>
    </div>
    <p class="gate-hint" id="gate-hint">press enter or →</p>
  </div>

  <!-- MAIN PAGE -->
  <div id="main">
    <div class="classification">
      <div><span class="dot"></span>status: pending</div>
      <div>abd_v1.0 — under preparation</div>
    </div>

    <div class="wrapper">
      <p class="eyebrow">something is coming</p>

      <h1 class="headline">
        The most unexpected chapter<br>
        of <span>Abdullah's</span> life
      </h1>

      <div class="signal-line"></div>

      <p class="subtext">coming soon.</p>

      <div class="cursor-block">
        <span class="terminal-text">preparing_</span>
        <span class="cursor"></span>
      </div>
    </div>

    <div class="bottom-bar">
      <span>© abdullah</span>
      <span class="right">watch this space</span>
    </div>
  </div>

  <!-- PARTICLES -->
  <canvas id="particles" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>

  <script>
    // ── Particles ──
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, parts = [];

    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    class P {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : H + 10;
        this.size = Math.random() * 1.2 + 0.3;
        this.vy = -(Math.random() * 0.3 + 0.1);
        this.vx = (Math.random() - 0.5) * 0.15;
        this.op = 0;
        this.maxOp = Math.random() * 0.35 + 0.05;
        this.fadingIn = true;
        this.life = 0;
        this.maxLife = Math.random() * 400 + 200;
      }
      update() {
        this.x += this.vx; this.y += this.vy; this.life++;
        if (this.fadingIn) {
          this.op = Math.min(this.op + 0.005, this.maxOp);
          if (this.op >= this.maxOp) this.fadingIn = false;
        }
        if (this.life > this.maxLife * 0.7) this.op = Math.max(this.op - 0.003, 0);
        if (this.life > this.maxLife || this.y < -10) this.reset(false);
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,169,110,${this.op})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 55; i++) parts.push(new P());
    (function loop() { ctx.clearRect(0,0,W,H); parts.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();

    // ── Gate logic ──
    const gate      = document.getElementById('gate');
    const main      = document.getElementById('main');
    const input     = document.getElementById('pwd-input');
    const inputRow  = document.getElementById('input-row');
    const hint      = document.getElementById('gate-hint');
    const arrow     = document.getElementById('submit-arrow');

    function attempt() {
      const val = input.value.trim().toLowerCase();
      if (val === 'moon') {
        inputRow.classList.add('correct');
        hint.textContent = '';
        // short pause then transition
        setTimeout(() => {
          gate.classList.add('hide');
          setTimeout(() => {
            gate.style.display = 'none';
            main.classList.add('show');
            // trigger animations by adding class
            document.querySelector('.wrapper').classList.add('main-visible');
            document.querySelector('.bottom-bar').classList.add('main-visible');
            document.querySelector('.classification') && document.querySelector('.classification').classList.add('main-visible');
          }, 950);
        }, 400);
      } else if (val !== '') {
        inputRow.classList.add('wrong');
        hint.classList.add('error');
        hint.textContent = 'not quite.';
        setTimeout(() => {
          inputRow.classList.remove('wrong');
          hint.classList.remove('error');
          hint.textContent = 'press enter or →';
          input.value = '';
        }, 1200);
      }
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
    arrow.addEventListener('click', attempt);

    // auto-focus
    window.addEventListener('load', () => setTimeout(() => input.focus(), 1200));
  </script>

</body>
</html>
