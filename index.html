<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdullah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #080808;
      --gold: #c8a96e;
      --gold-dim: #7a6340;
      --white: #e8e4dc;
      --text-dim: #888;
      --red: #8b3a3a;
      --surface: #0f0f0f;
      --border: #222;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.5;
    }

    body::after {
      content: '';
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: breathe 7s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { opacity:0.5; transform:translate(-50%,-50%) scale(1); }
      50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.12); }
    }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center; justify-content: center;
      padding: 2rem;
    }

    .inner {
      width: 100%; max-width: 520px;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--white);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.8;
      padding: 1rem 1.2rem;
      resize: none;
      outline: none;
      min-height: 140px;
      transition: border-color 0.3s;
      caret-color: var(--gold);
    }
    textarea::placeholder { color: #444; font-style: italic; }
    textarea:focus { border-color: #2e2e2e; }

    .send-btn {
      margin-top: 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: block; width: 100%;
    }
    .send-btn:hover:not(:disabled) { border-color: var(--gold-dim); color: var(--gold); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .send-status {
      margin-top: 0.7rem;
      font-size: 0.55rem; letter-spacing: 0.15em;
      text-transform: uppercase; min-height: 1em;
      color: var(--text-dim); transition: color 0.3s;
    }
    .send-status.ok  { color: var(--gold-dim); }
    .send-status.err { color: var(--red); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }

    #particles {
      position: fixed; inset: 0;
      z-index: 0; pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="page">
    <div class="inner">
      <textarea id="msg-box" rows="5" placeholder="Feeling stupid. Might deleted by next week lol."></textarea>
      <button class="send-btn" id="send-btn">send →</button>
      <p class="send-status" id="send-status"></p>
    </div>
  </div>

  <script>
    // particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, parts = [];
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    resize(); window.addEventListener('resize', resize);
    class P {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : H + 10;
        this.size = Math.random() * 1.1 + 0.2;
        this.vy = -(Math.random() * 0.25 + 0.08);
        this.vx = (Math.random() - 0.5) * 0.12;
        this.op = 0; this.maxOp = Math.random() * 0.25 + 0.04;
        this.fadingIn = true; this.life = 0;
        this.maxLife = Math.random() * 500 + 200;
      }
      update() {
        this.x += this.vx; this.y += this.vy; this.life++;
        if (this.fadingIn) { this.op = Math.min(this.op + 0.004, this.maxOp); if (this.op >= this.maxOp) this.fadingIn = false; }
        if (this.life > this.maxLife * 0.7) this.op = Math.max(this.op - 0.002, 0);
        if (this.life > this.maxLife || this.y < -10) this.reset(false);
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,169,110,${this.op})`; ctx.fill();
      }
    }
    for (let i = 0; i < 50; i++) parts.push(new P());
    (function loop() { ctx.clearRect(0,0,W,H); parts.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();

    // telegram
    const BOT_TOKEN = '8808955791:AAHzwj9C9mos0M5h4I9jMQYoP3Qm1XU3-NI';
    const CHAT_ID   = '5229107133';

    document.getElementById('send-btn').addEventListener('click', async () => {
      const text   = document.getElementById('msg-box').value.trim();
      const btn    = document.getElementById('send-btn');
      const status = document.getElementById('send-status');

      if (!text) {
        status.className = 'send-status err';
        status.textContent = 'write something first.';
        return;
      }

      btn.disabled = true;
      status.className = 'send-status';
      status.textContent = 'sending...';

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: `🌙 new message:\n\n"${text}"` })
        });
        const data = await res.json();
        if (data.ok) {
          status.className = 'send-status ok';
          status.textContent = 'sent.';
          document.getElementById('msg-box').value = '';
        } else { throw new Error(); }
      } catch {
        status.className = 'send-status err';
        status.textContent = 'something went wrong. try again.';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
