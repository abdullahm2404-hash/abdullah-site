<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdullah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --gold: #c8a96e;
      --gold-dim: #7a6340;
      --white: #e8e4dc;
      --muted: #3a3a3a;
      --text-dim: #6b6560;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    /* Subtle noise texture via SVG */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Radial ambient glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200, 169, 110, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    /* Top classification bar */
    .classification {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 0.6rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--muted);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .classification .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: inline-block;
      margin-right: 0.5rem;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; background: var(--gold); }
    }

    /* Main content */
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--white);
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }

    .headline span {
      color: var(--gold);
      font-style: normal;
      font-weight: 400;
    }

    /* The signature element: a breathing horizontal line with a cursor */
    .signal-line {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 2.8rem auto 2.8rem;
      width: 1px;
      opacity: 0;
      animation: fadeUp 1s ease 0.9s forwards, expand-line 1.2s ease 1.2s forwards;
      overflow: hidden;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }

    @keyframes expand-line {
      from { width: 1px; }
      to { width: min(320px, 60vw); }
    }

    .subtext {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.6rem, 1.8vw, 0.72rem);
      letter-spacing: 0.18em;
      color: var(--text-dim);
      line-height: 2;
      text-transform: uppercase;
      max-width: 360px;
      opacity: 0;
      animation: fadeUp 1s ease 1.5s forwards;
    }

    /* Blinking cursor line — the real signature */
    .cursor-block {
      margin: 2rem auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 2.2s forwards;
    }

    .terminal-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 0.9em;
      background: var(--gold);
      opacity: 0;
      animation: blink 1.1s step-end infinite 2.5s, fadeIn 0.3s ease 2.5s forwards;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      border-top: 1px solid #1a1a1a;
      opacity: 0;
      animation: fadeIn 1s ease 2.8s forwards;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 480px) {
      .classification { display: none; }
      .bottom-bar { justify-content: center; }
      .bottom-bar .right { display: none; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <div class="classification">
    <div><span class="dot"></span>status: pending</div>
    <div>abd_v1.0 — under preparation</div>
  </div>

  <div class="wrapper">
    <p class="eyebrow">something is coming</p>

    <h1 class="headline">
      The most unexpected chapter<br>
      of <span>Abdullah's</span> life
    </h1>

    <div class="signal-line"></div>

    <p class="subtext">coming soon.</p>

    <div class="cursor-block">
      <span class="terminal-text">preparing_</span>
      <span class="cursor"></span>
    </div>
  </div>

  <div class="bottom-bar">
    <span>© abdullah</span>
    <span class="right">watch this space</span>
  </div>

  <canvas id="particles" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(true); }
      reset(initial) {
        this.x = Math.random() * W;
        this.y = initial ? Math.random() * H : H + 10;
        this.size = Math.random() * 1.2 + 0.3;
        this.speedY = -(Math.random() * 0.3 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.15;
        this.opacity = 0;
        this.maxOpacity = Math.random() * 0.35 + 0.05;
        this.fadeIn = true;
        this.life = 0;
        this.maxLife = Math.random() * 400 + 200;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life++;
        if (this.fadeIn) {
          this.opacity = Math.min(this.opacity + 0.005, this.maxOpacity);
          if (this.opacity >= this.maxOpacity) this.fadeIn = false;
        }
        if (this.life > this.maxLife * 0.7) {
          this.opacity = Math.max(this.opacity - 0.003, 0);
        }
        if (this.life > this.maxLife || this.y < -10) this.reset(false);
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 169, 110, ${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 55; i++) particles.push(new Particle());

    function loop() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  </script>

</body>
</html>
